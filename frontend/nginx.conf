# frontend Nginx 配置
# 说明：
# - SPA history 路由回退到 index.html
# - /api 反向代理到后端业务服务，/agent 反向代理到 AI Agent 服务
# - 容器网络内使用服务名（business-service / ai-agent-service），
#   与 docker-compose.yml 中 campus-network 网络一致

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;

    # 静态资源缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端业务服务代理
    # proxy_pass 尾部斜杠会剥离 /api/ 前缀：/api/auth/login -> business-service:8080/auth/login
    # 读写超时 300s：与 business-service 转发 AI 服务的 read-timeout-ms=300000 对齐
    location /api/ {
        proxy_pass http://business-service:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # AI Agent 服务代理
    # proxy_pass 尾部斜杠会剥离 /agent/ 前缀：/agent/api/v1/chat -> ai-agent-service:8001/api/v1/chat
    # 读写超时 300s：与 /api/ 保持一致，覆盖多轮 ReAct 长耗时请求
    location /agent/ {
        proxy_pass http://ai-agent-service:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
